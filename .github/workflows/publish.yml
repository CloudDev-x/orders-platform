name: publish

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::746491202337:role/orders-dev-gha-ecr-push
  ECR_REGISTRY: 746491202337.dkr.ecr.us-east-1.amazonaws.com

jobs:
  images:
    name: build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orders]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GHAECRPush

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/orders-platform/${{ matrix.service }}:${{ github.sha }}
